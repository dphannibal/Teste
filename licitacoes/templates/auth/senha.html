{% extends 'base.html' %}
{% block titulo %}Trocar senha{% endblock %}
{% block conteudo %}
<div class="cartao estreito">
  <h1>Trocar senha</h1>
  {% if g.usuario.trocar_senha %}<p class="aviso aviso-info">Você está usando uma senha temporária. Defina uma senha pessoal para continuar.</p>{% endif %}
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Senha atual <input type="password" name="senha_atual" required autocomplete="current-password"></label>
    <label>Nova senha <input type="password" name="nova_senha" required minlength="8" autocomplete="new-password"></label>
    <label>Confirme a nova senha <input type="password" name="confirmacao" required minlength="8" autocomplete="new-password"></label>
    <button class="primario">Salvar</button>
  </form>
</div>
{% endblock %}
