{% extends 'base.html' %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="cartao estreito login">
  <h1>Agenda de Licitações</h1>
  <p class="sutil">{{ nome_orgao }} — acesso restrito à intranet</p>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Usuário <input name="login" required autofocus autocomplete="username" value="{{ request.form.login }}"></label>
    <label>Senha <input type="password" name="senha" required autocomplete="current-password"></label>
    <button class="primario">Entrar</button>
  </form>
</div>
{% endblock %}
